<!doctype html>
<html class="page" lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Nike Air Mag</title>
		<link rel="stylesheet" href="css/index.css  " />
		<link
			rel="shortcut icon"
			href="img/nike-48_46226.ico"
			type="image/x-icon"
		/>
		<script defer src="./js/index.js" type="module"></script>
	</head>
	<body class="page__body">
		<header class="header">
			<div class="container header__container">
				<a href="#" class="logo header__logo">
					<img
						src="./img/logo-nike.svg"
						width="50"
						height="20"
						alt="Логотип Nike"
					/>
				</a>
				<nav
					class="menu header__menu"
					id="header__menu"
					aria-label="Главное меню"
				>
					<ul class="menu__list">
						<li class="menu__item">
							<a class="menu__link" href="#air-mag" lang="en">Air-mag</a>
						</li>
						<li class="menu__item">
							<a class="menu__link" href="#sizes">Размеры</a>
						</li>
						<li class="menu__item">
							<a class="menu__link" href="#characteristics">Характеристики</a>
						</li>
						<li class="menu__item">
							<a class="menu__link" href="#top-models">Другие Топ модели</a>
						</li>
					</ul>
				</nav>
				<div class="header__controls">
					<a class="header__order" href="#">Сделать заказ</a>
					<div class="header__action">
						<button
							class="header__action-button"
							title="Поиск"
							aria-label="Поиск"
						>
							<svg width="24" height="24">
								<use
									class="header__action-icon"
									href="./img/sprite.svg#search "
								></use>
							</svg>
						</button>
						<button
							class="header__action-button"
							title="Корзина"
							aria-label="Корзина"
						>
							<svg width="24" height="24">
								<use
									class="header__action-icon"
									href="./img/sprite.svg#cart-buy "
								></use>
							</svg>
						</button>
						<button
							class="header__burger burger"
							title="Бургер"
							aria-label="Открыть меню"
							aria-expanded="false"
							aria-controls="header__menu"
						>
							<svg width="24" height="24">
								<use
									class="burger__icon-menu"
									href="./img/sprite.svg#menu-burger"
								></use>
								<use
									class="burger__icon-cross"
									href="./img/sprite.svg#menu-cross"
								></use>
							</svg>
						</button>
					</div>
				</div>
			</div>
		</header>
	</body>
</html>
