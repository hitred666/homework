<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Практика по таблицам</title>
		<link rel="stylesheet" href="style.css" />
	</head>
	<body>
		<table>
			<thead>
				<caption class="title">
					Июнь 2025
				</caption>
				<th>пн</th>
				<th>вт</th>
				<th>ср</th>
				<th>чт</th>
				<th>пт</th>
				<th class="color">сб</th>
				<th class="color">вс</th>
			</thead>
			<tbody>
				<tr>
					<td class="one"></td>
					<td class="two"></td>
					<td class="three"></td>
					<td class="four"></td>
					<td class="five"></td>
					<td class="six"></td>
					<td colspan="2" class="color">01</td>
				</tr>
				<tr>
					<td>02</td>
					<td>03</td>
					<td>04</td>
					<td>05</td>
					<td>06</td>
					<td class="color">07</td>
					<td class="color">08</td>
				</tr>
				<tr>
					<td>09</td>
					<td>10</td>
					<td>11</td>
					<td>12</td>
					<td>13</td>
					<td class="color">14</td>
					<td class="color">15</td>
				</tr>
				<tr>
					<td>16</td>
					<td>17</td>
					<td>18</td>
					<td>19</td>
					<td>20</td>
					<td class="color">21</td>
					<td class="color">22</td>
				</tr>
				<tr>
					<td>23</td>
					<td>24</td>
					<td>25</td>
					<td>26</td>
					<td>27</td>
					<td class="color">28</td>
					<td class="color">29</td>
				</tr>
				<tr>
					<td>30</td>
					<td class="one-2"></td>
					<td class="two-2"></td>
					<td class="three-2"></td>
					<td class="four-2"></td>
					<td class="five-2"></td>
					<td class="six-2"></td>
				</tr>
			</tbody>
		</table>
	</body>
</html>
